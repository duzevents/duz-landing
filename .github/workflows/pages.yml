name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency: pages

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Verify
        run: |
          npx --yes html-validate@9.7.1 -- *.html
          
          INVALID_URLS=$(grep -hioE '((https?:[\\/]*)|([\\/]{2})|(:[\\/]+)|javascript:|data:)[^"'"'"'`[:space:]><();,]+' index.html 404.html privacy-policy.html consents.html styles.css assets/script.js | sort | uniq | grep -viE '^((https?:[\\/]*)|([\\/]{2})|(:[\\/]+))(www\.duz\.events|app\.duz\.events|www\.w3\.org|ico\.org\.uk)([\\/].*)?$' || true)
          if [ -n "$INVALID_URLS" ]; then
            echo "Error: Found disallowed third-party requests:"
            echo "$INVALID_URLS"
            exit 1
          fi

      - name: Check placeholders
        run: |
          if grep -n '\[\[' *.html; then
            echo "Error: Unfilled placeholders found in HTML files"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Stage files (allowlist only)
        run: |
          set -eu
          mkdir -p _site/assets
          for f in index.html 404.html styles.css robots.txt sitemap.xml CNAME privacy-policy.html consents.html; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp -R assets/. _site/assets/
          rm -f _site/assets/og.html
          if find _site \( -name '*.md' -o -path '*/spec_and_plans*' -o -path '*/docs*' -o -name '.*' \) | grep -q .; then
            echo "Refusing to publish internal files:"; find _site \( -name '*.md' -o -path '*/spec_and_plans*' -o -path '*/docs*' -o -name '.*' \)
            exit 1
          fi
          find _site -type f | sort
      
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site/
          
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
