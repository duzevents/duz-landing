name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency: pages

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
        with:
          persist-credentials: false
      
      - name: Verify
        run: |
          npx --yes html-validate@9.7.1 -- *.html
          
          INVALID_URLS=$(cat *.html styles.css assets/script.js | python3 -c 'import sys, html; sys.stdout.write(html.unescape(sys.stdin.buffer.read().decode("utf-8", "replace")))' | grep -ioE '((https?:[\\/]*)|([\\/]{2})|(:[\\/]+)|javascript:|data:)[^"'"'"'`[:space:]><();,]+' | sort | uniq | grep -viE '^((https?:[\\/]*)|([\\/]{2})|(:[\\/]+))(www\.duz\.events|app\.duz\.events|www\.w3\.org|ico\.org\.uk)([/?#].*)?$' || true)
          if [ -n "$INVALID_URLS" ]; then
            echo "Error: Found disallowed third-party requests:"
            echo "$INVALID_URLS"
            exit 1
          fi

      - name: Check placeholders
        run: |
          if grep -n '\[\[' *.html; then
            echo "Error: Unfilled placeholders found in HTML files"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment: github-pages
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
        with:
          persist-credentials: false
      
      - name: Stage files
        run: |
          mkdir -p _site
          cp -r * _site/ 2>/dev/null || true
          rm -rf _site/.github _site/README.md _site/assets/og.html
      
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site/
          
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
